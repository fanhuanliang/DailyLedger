name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
  containers:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: dailyledger-ci
      BIND_IP: 127.0.0.1
      APP_PORT: '18095'
      APP_ORIGIN: http://127.0.0.1:18095
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and start isolated containers
        run: docker compose up --build --detach --wait --wait-timeout 120
      - name: Check web and API through the reverse proxy
        run: |
          curl --fail --silent --show-error http://127.0.0.1:18095/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:18095/api/v1/health | jq -e '.data.status == "ready"'
      - name: Remove disposable CI containers and synthetic database
        if: always()
        run: docker compose down --volumes
