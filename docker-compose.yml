services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5010
      DB_PATH: /app/data/ledger.db
      HOUSEHOLD_TIMEZONE: ${HOUSEHOLD_TIMEZONE:-America/Los_Angeles}
    volumes:
      - ledger_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5010/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${BIND_IP:-127.0.0.1}:${APP_PORT:-8095}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  ledger_data:
